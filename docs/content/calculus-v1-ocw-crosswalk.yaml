    note: "Extrema taught inside curve sketching, not as a standalone session."
  - concept: mean-value-theorem
    ocw_sessions:
      - {s: 34, t: "Introduction to the Mean Value Theorem"}
      - {s: 35, t: "Using the Mean Value Theorem"}
    coverage: full
  - concept: shape-of-graph
    ocw_sessions:
      - {s: 27, t: "Sketching Graphs I - Polynomials and Rational Functions"}
      - {s: 28, t: "Sketching Graphs II - General Strategies"}
    coverage: full
  - concept: limits-at-infinity
    ocw_sessions:
      - {s: 27, t: "Sketching Graphs I - Polynomials and Rational Functions"}
      - {s: 89, t: "L'Hospital's Rule and Rates of Growth"}
    coverage: partial
  - concept: optimization
