# OCW material with no concept in the Volume 1 graph.
# Honest boundary: 18.01 is a superset of OpenStax Volume 1.
ocw_only_material:
  - sessions: "25-26"
    topic: "Quadratic approximation"
  - sessions: "39-40"
    topic: "Differential equations, separation of variables (mapped above only for growth/decay)"
  - sessions: "62-65"
    topic: "Probability, numerical integration, bell curve"
  - sessions: "68-77"
    topic: "Techniques of integration: trig powers, trig substitution, partial fractions, integration by parts (OpenStax Volume 2, chapter 3)"
  - sessions: "80-84"
    topic: "Parametric equations and polar coordinates (OpenStax Volume 2)"
  - sessions: "91-93"
    topic: "Improper integrals (OpenStax Volume 2)"
  - sessions: "94-101"
    topic: "Infinite series, power series, Taylor series (OpenStax Volume 2, chapters 5-6)"

coverage_summary:
  full: 25
  partial: 15
  none: 5
  note: >
    The 5 uncovered concepts are precalculus review (functions-review,
    function-classes, trig-functions), epsilon-delta rigor
    (precise-limit-definition), and physical-applications. Every
    derivative and integration core concept has OCW assessment material.
