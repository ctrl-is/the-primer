concepts:
  # ---------------- Chapter 1: Functions and Graphs ----------------
  - id: functions-review
    name: Review of Functions (1.1)
    description: >
      Function notation, domain and range, graphs, zeros, combining
      functions, and symmetry.
    prerequisites: []
    difficulty: 1
    tags: [ch1, precalculus, foundational]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.70
    mastery_criteria:
      - "Can use functional notation to evaluate a function"
      - "Can determine the domain and range of a function"
      - "Can draw the graph of a function"
      - "Can find the zeros of a function"
      - "Can recognize a function from a table of values"
      - "Can make new functions from two or more given functions"
      - "Can describe the symmetry properties of a function"
    misconceptions:
      - "Treating f(x+h) as f(x) + f(h)"
      - "Confusing the domain restriction of a composite with that of its parts"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 15

  - id: function-classes
    name: Basic Classes of Functions (1.2)
    description: >
      Linear, polynomial, rational, power, root, algebraic vs
      transcendental, piecewise functions, and graph transformations.
    prerequisites: [functions-review]
    difficulty: 1
    tags: [ch1, precalculus, foundational]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.70
    mastery_criteria:
      - "Can calculate the slope of a linear function and interpret its meaning"
      - "Can recognize the degree of a polynomial"
      - "Can find the roots of a quadratic polynomial"
      - "Can describe the graphs of basic odd and even polynomial functions"
      - "Can identify a rational function"
      - "Can describe the graphs of power and root functions"
      - "Can explain the difference between algebraic and transcendental functions"
      - "Can graph a piecewise-defined function"
      - "Can sketch the graph of a function that has been shifted, stretched, or reflected"
    misconceptions:
      - "Reading a vertical shift as horizontal (f(x) + c vs f(x + c))"
      - "Assuming every polynomial of even degree has real roots"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 20

  - id: trig-functions
    name: Trigonometric Functions (1.3)
    description: >
      Radians, the triangular and circular definitions, basic
      identities, and the graphs and periods of trig functions.
    prerequisites: [functions-review]
    difficulty: 2
    tags: [ch1, precalculus, trigonometry]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.72
    mastery_criteria:
      - "Can convert angle measures between degrees and radians"
      - "Can recognize the triangular and circular definitions of the basic trigonometric functions"
      - "Can write the basic trigonometric identities"
      - "Can identify the graphs and periods of the trigonometric functions"
      - "Can describe the shift of a sine or cosine graph from the equation of the function"
    misconceptions:
      - "Working in degrees where calculus formulas assume radians"
      - "Confusing period with amplitude in transformed graphs"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 20

  - id: inverse-functions
    name: Inverse Functions (1.4)
    description: >
      One-to-one functions, the horizontal line test, finding and
      graphing inverses, and inverse trigonometric functions.
    prerequisites: [functions-review, function-classes]
    difficulty: 2
    tags: [ch1, precalculus]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.72
    mastery_criteria:
      - "Can determine the conditions for when a function has an inverse"
      - "Can use the horizontal line test to recognize when a function is one-to-one"
      - "Can find the inverse of a given function"
      - "Can draw the graph of an inverse function"
      - "Can evaluate inverse trigonometric functions"
    misconceptions:
      - "Reading f^-1(x) as 1/f(x)"
      - "Forgetting the domain restriction needed to invert trig functions"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 20

  - id: exp-log-functions
    name: Exponential and Logarithmic Functions (1.5)
    description: >
      Exponential and logarithmic forms, the number e, change of
      base, and the hyperbolic functions.
    prerequisites: [inverse-functions]
    difficulty: 2
    tags: [ch1, precalculus]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.72
    mastery_criteria:
      - "Can identify the form of an exponential function"
      - "Can explain the difference between the graphs of b^x and x^b"
      - "Can recognize the significance of the number e"
      - "Can identify the form of a logarithmic function"
      - "Can explain the relationship between exponential and logarithmic functions"
      - "Can describe how to calculate a logarithm to a different base"
      - "Can identify the hyperbolic functions, their graphs, and basic identities"
    misconceptions:
      - "Treating ln(a + b) as ln a + ln b"
      - "Confusing exponential growth b^x with power growth x^b"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 20

  # ---------------- Chapter 2: Limits ----------------
  - id: calculus-preview
    name: A Preview of Calculus (2.1)
    description: >
      The tangent problem and the area problem, and how limits lead
      to the derivative and the integral.
    prerequisites: [functions-review]
    difficulty: 2
    tags: [ch2, limits, conceptual]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.72
    mastery_criteria:
      - "Can describe the tangent problem and how it led to the idea of a derivative"
      - "Can explain how the idea of a limit is involved in solving the tangent problem"
      - "Can recognize a tangent to a curve at a point as the limit of secant lines"
      - "Can identify instantaneous velocity as the limit of average velocity over a small time interval"
      - "Can describe the area problem and how it was solved by the integral"
      - "Can explain how the idea of a limit is involved in solving the area problem"
    misconceptions:
      - "Believing a secant line becomes the tangent after finitely many steps"
      - "Treating instantaneous velocity as distance divided by zero time"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 20

  - id: limit-of-a-function
    name: The Limit of a Function (2.2)
    description: >
      Limit notation, estimating limits from tables and graphs,
      one-sided limits, infinite limits, and vertical asymptotes.
    prerequisites: [calculus-preview, function-classes]
    difficulty: 2
    tags: [ch2, limits, core]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.72
    mastery_criteria:
      - "Can describe the limit of a function using correct notation"
      - "Can use a table of values to estimate the limit of a function or to identify when the limit does not exist"
      - "Can use a graph to estimate the limit of a function or to identify when the limit does not exist"
      - "Can define one-sided limits and provide examples"
      - "Can explain the relationship between one-sided and two-sided limits"
      - "Can describe an infinite limit using correct notation"
      - "Can define a vertical asymptote"
    misconceptions:
      - "Assuming the limit at a point must equal the function's value there"
      - "Concluding a limit does not exist whenever the function is undefined at the point"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 25

  - id: limit-laws
    name: The Limit Laws (2.3)
    description: >
      Evaluating limits with the limit laws, factoring, conjugates,
      and the squeeze theorem.
    prerequisites: [limit-of-a-function]
    difficulty: 2
    tags: [ch2, limits, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.72
    mastery_criteria:
      - "Can recognize the basic limit laws"
      - "Can use the limit laws to evaluate the limit of a function"
      - "Can evaluate the limit of a function by factoring"
      - "Can use the limit laws to evaluate the limit of a polynomial or rational function"
      - "Can evaluate the limit of a function by factoring or by using conjugates"
      - "Can evaluate the limit of a function by using the squeeze theorem"
    misconceptions:
      - "Treating a 0/0 form as proof the limit does not exist"
      - "Applying quotient limit laws when the denominator limit is zero"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  - id: continuity
    name: Continuity (2.4)
    description: >
      The three conditions for continuity at a point, types of
      discontinuity, continuity on intervals, and the intermediate
      value theorem.
    prerequisites: [limit-laws]
    difficulty: 3
    tags: [ch2, limits, core]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.75
    mastery_criteria:
      - "Can explain the three conditions for continuity at a point"
      - "Can describe three kinds of discontinuities"
      - "Can define continuity on an interval"
      - "Can state the theorem for limits of composite functions"
      - "Can provide an example of the intermediate value theorem"
    misconceptions:
      - "Believing a function with a limit at a point is automatically continuous there"
      - "Using the intermediate value theorem to locate a value where hypotheses fail"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 25

  - id: precise-limit-definition
    name: The Precise Definition of a Limit (2.5)
    description: >
      The epsilon-delta definition of a limit, applying it to prove
      limits, and its one-sided and infinite variants.
    prerequisites: [limit-laws]
    difficulty: 4
    tags: [ch2, limits, rigor]
    bloom_level: analyze
    assessment_modality: explanation
    passing_threshold: 0.78
    mastery_criteria:
      - "Can describe the epsilon-delta definition of a limit"
      - "Can apply the epsilon-delta definition to find the limit of a function"
      - "Can describe the epsilon-delta definitions of one-sided limits and infinite limits"
      - "Can use the epsilon-delta definition to prove the limit laws"
    misconceptions:
      - "Reversing the quantifiers: choosing epsilon after delta"
      - "Believing one verified epsilon value proves the limit"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 30

  # ---------------- Chapter 3: Derivatives ----------------
  - id: defining-the-derivative
    name: Defining the Derivative (3.1)
    description: >
      Tangent lines, the derivative at a point as a limit of
      difference quotients, and velocity as a rate of change.
    prerequisites: [limit-laws, continuity]
    difficulty: 3
    tags: [ch3, derivatives, core]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.75
    mastery_criteria:
      - "Can recognize the meaning of the tangent to a curve at a point"
      - "Can calculate the slope of a tangent line"
      - "Can identify the derivative as the limit of a difference quotient"
      - "Can calculate the derivative of a given function at a point"
      - "Can describe the velocity as a rate of change"
      - "Can explain the difference between average velocity and instantaneous velocity"
      - "Can estimate the derivative from a table of values"
    misconceptions:
      - "Treating the derivative as the tangent line itself rather than its slope"
      - "Computing average rate of change and calling it instantaneous"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 25

  - id: derivative-as-function
    name: The Derivative as a Function (3.2)
    description: >
      The derivative function, graphing f' from f, differentiability
      and continuity, and higher-order derivatives.
    prerequisites: [defining-the-derivative]
    difficulty: 3
    tags: [ch3, derivatives, core]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.75
    mastery_criteria:
      - "Can define the derivative function of a given function"
      - "Can graph a derivative function from the graph of a given function"
      - "Can state the connection between derivatives and continuity"
      - "Can describe three conditions for when a function does not have a derivative"
      - "Can explain the meaning of a higher-order derivative"
    misconceptions:
      - "Believing continuity implies differentiability"
      - "Confusing the graph of f' with the graph of f"
    decay_halflife_days: 28
    max_attempts: 3
    estimated_minutes: 25

  - id: differentiation-rules
    name: Differentiation Rules (3.3)
    description: >
      Constant, power, sum, difference, product, and quotient rules,
      combined to differentiate polynomials and rational functions.
    prerequisites: [derivative-as-function]
    difficulty: 2
    tags: [ch3, derivatives, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.72
    mastery_criteria:
      - "Can state the constant, constant multiple, and power rules"
      - "Can apply the sum and difference rules to combine derivatives"
      - "Can use the product rule for finding the derivative of a product of functions"
      - "Can use the quotient rule for finding the derivative of a quotient of functions"
      - "Can extend the power rule to functions with negative exponents"
      - "Can combine the differentiation rules to find the derivative of a polynomial or rational function"
    misconceptions:
      - "Differentiating a product term by term: (fg)' = f'g'"
      - "Forgetting the order of terms in the quotient rule numerator"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  - id: rates-of-change
    name: Derivatives as Rates of Change (3.4)
    description: >
      Average vs instantaneous rate of change, motion along a line,
      population growth, and marginal cost and revenue.
    prerequisites: [derivative-as-function]
    difficulty: 3
    tags: [ch3, derivatives, applications]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can determine a new value of a quantity from the old value and the amount of change"
      - "Can calculate the average rate of change and explain how it differs from the instantaneous rate of change"
      - "Can apply rates of change to displacement, velocity, and acceleration of an object moving along a straight line"
      - "Can predict the future population from the present value and the population growth rate"
      - "Can use derivatives to calculate marginal cost and revenue in a business situation"
    misconceptions:
      - "Confusing speed with velocity when motion reverses direction"
      - "Treating acceleration as zero whenever velocity is zero"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  - id: trig-derivatives
    name: Derivatives of Trigonometric Functions (3.5)
    description: >
      Derivatives of sine, cosine, and the other standard trig
      functions, and their higher-order derivatives.
    prerequisites: [differentiation-rules, trig-functions]
    difficulty: 3
    tags: [ch3, derivatives, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can find the derivatives of the sine and cosine function"
      - "Can find the derivatives of the standard trigonometric functions"
      - "Can calculate the higher-order derivatives of the sine and cosine"
    misconceptions:
      - "Dropping the negative sign in the derivative of cosine"
      - "Assuming trig derivative formulas hold when angles are in degrees"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 20

  - id: chain-rule
    name: The Chain Rule (3.6)
    description: >
      Differentiating compositions, combining the chain rule with
      the power, product, and quotient rules.
    prerequisites: [differentiation-rules]
    difficulty: 3
    tags: [ch3, derivatives, technique, core]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can state the chain rule for the composition of two functions"
      - "Can apply the chain rule together with the power rule"
      - "Can apply the chain rule and the product/quotient rules correctly in combination when both are necessary"
      - "Can recognize the chain rule for a composition of three or more functions"
      - "Can describe the proof of the chain rule"
    misconceptions:
      - "Forgetting to multiply by the derivative of the inner function"
      - "Applying the power rule to the outer function while ignoring composition"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 30

  - id: inverse-derivatives
    name: Derivatives of Inverse Functions (3.7)
    description: >
      The inverse function theorem and the derivatives of the
      standard inverse trigonometric functions.
    prerequisites: [chain-rule, inverse-functions]
    difficulty: 3
    tags: [ch3, derivatives, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can calculate the derivative of an inverse function"
      - "Can recognize the derivatives of the standard inverse trigonometric functions"
    misconceptions:
      - "Evaluating (f^-1)' at x instead of at f^-1(x)"
      - "Treating the derivative of an inverse as the reciprocal of f'(x) at the same x"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 20

  - id: implicit-differentiation
    name: Implicit Differentiation (3.8)
    description: >
      Differentiating implicitly defined relations and finding
      tangent lines to implicit curves.
    prerequisites: [chain-rule]
    difficulty: 3
    tags: [ch3, derivatives, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can find the derivative of a complicated function by using implicit differentiation"
      - "Can use implicit differentiation to determine the equation of a tangent line"
    misconceptions:
      - "Differentiating y-terms without the dy/dx factor"
      - "Solving for dy/dx before differentiating every term"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  - id: exp-log-derivatives
    name: Derivatives of Exponential and Logarithmic Functions (3.9)
    description: >
      Derivatives of exponentials and logarithms, and logarithmic
      differentiation.
    prerequisites: [chain-rule, exp-log-functions]
    difficulty: 3
    tags: [ch3, derivatives, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can find the derivative of exponential functions"
      - "Can find the derivative of logarithmic functions"
      - "Can use logarithmic differentiation to determine the derivative of a function"
    misconceptions:
      - "Applying the power rule to x in the exponent: d/dx b^x = x b^(x-1)"
      - "Differentiating ln(f(x)) without the f'(x)/f(x) structure"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  # ---------------- Chapter 4: Applications of Derivatives ----------------
  - id: related-rates
    name: Related Rates (4.1)
    description: >
      Expressing changing quantities as derivatives and relating
      their rates through the chain rule.
    prerequisites: [chain-rule, implicit-differentiation]
    difficulty: 4
    tags: [ch4, applications]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.78
    mastery_criteria:
      - "Can express changing quantities in terms of derivatives"
      - "Can find relationships among the derivatives in a given problem"
      - "Can use the chain rule to find the rate of change of one quantity that depends on the rate of change of other quantities"
    misconceptions:
      - "Substituting specific values before differentiating the relation"
      - "Treating all quantities as constants except the one asked about"
    decay_halflife_days: 14
    max_attempts: 3
    estimated_minutes: 30

  - id: linear-approximation
    name: Linear Approximations and Differentials (4.2)
    description: >
      Linearization at a point, differentials, and estimating change
      and error.
    prerequisites: [derivative-as-function]
    difficulty: 3
    tags: [ch4, applications]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.75
    mastery_criteria:
      - "Can describe the linear approximation to a function at a point"
      - "Can write the linearization of a given function"
      - "Can draw a graph that illustrates the use of differentials to approximate the change in a quantity"
      - "Can calculate the relative error and percentage error in using a differential approximation"
    misconceptions:
      - "Using the linearization far from the point of tangency without noting error growth"
      - "Confusing dy (differential) with Δy (actual change)"
    decay_halflife_days: 14
    max_attempts: 3
    estimated_minutes: 25

  - id: maxima-minima
    name: Maxima and Minima (4.3)
    description: >
      Absolute and local extrema, critical points, and locating
      absolute extrema on closed intervals.
    prerequisites: [derivative-as-function]
    difficulty: 3
    tags: [ch4, applications, core]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.75
    mastery_criteria:
      - "Can define absolute extrema"
      - "Can define local extrema"
      - "Can explain how to find the critical points of a function over a closed interval"
      - "Can describe how to use critical points to locate absolute extrema over a closed interval"
    misconceptions:
      - "Assuming every critical point is a local extremum"
      - "Forgetting to check interval endpoints for absolute extrema"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  - id: mean-value-theorem
    name: The Mean Value Theorem (4.4)
    description: >
      Rolle's theorem, the Mean Value Theorem, and its consequences.
    prerequisites: [maxima-minima]
    difficulty: 3
    tags: [ch4, theory]
    bloom_level: understand
    assessment_modality: explanation
    passing_threshold: 0.75
    mastery_criteria:
      - "Can explain the meaning of Rolle's theorem"
      - "Can describe the significance of the Mean Value Theorem"
      - "Can state three important consequences of the Mean Value Theorem"
    misconceptions:
      - "Applying the theorem when continuity or differentiability hypotheses fail"
      - "Believing the guaranteed point c is unique or computable without work"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 25

  - id: shape-of-graph
    name: Derivatives and the Shape of a Graph (4.5)
    description: >
      First and second derivative tests, concavity, and inflection
      points.
    prerequisites: [maxima-minima, mean-value-theorem]
    difficulty: 4
    tags: [ch4, applications, core]
    bloom_level: analyze
    assessment_modality: explanation
    passing_threshold: 0.78
    mastery_criteria:
      - "Can explain how the sign of the first derivative affects the shape of a function's graph"
      - "Can state the first derivative test for critical points"
      - "Can use concavity and inflection points to explain how the sign of the second derivative affects the shape of a function's graph"
      - "Can explain the concavity test for a function over an open interval"
      - "Can explain the relationship between a function and its first and second derivatives"
      - "Can state the second derivative test for local extrema"
    misconceptions:
      - "Assuming f''(x) = 0 always marks an inflection point"
      - "Reading increasing f' as positive f"
    decay_halflife_days: 21
    max_attempts: 3
    estimated_minutes: 30

  - id: limits-at-infinity
    name: Limits at Infinity and Asymptotes (4.6)
    description: >
      End behavior, horizontal and oblique asymptotes, and full
      curve sketching from derivatives.
    prerequisites: [limit-of-a-function, shape-of-graph]
    difficulty: 4
    tags: [ch4, applications]
    bloom_level: analyze
    assessment_modality: application
    passing_threshold: 0.78
    mastery_criteria:
      - "Can calculate the limit of a function as x increases or decreases without bound"
      - "Can recognize a horizontal asymptote on the graph of a function"
      - "Can estimate the end behavior of a function as x increases or decreases without bound"
      - "Can recognize an oblique asymptote on the graph of a function"
      - "Can analyze a function and its derivatives to draw its graph"
    misconceptions:
      - "Believing a graph can never cross its horizontal asymptote"
      - "Treating infinity as a number that can be substituted directly"
    decay_halflife_days: 14
    max_attempts: 3
    estimated_minutes: 30

  - id: optimization
    name: Applied Optimization Problems (4.7)
    description: >
      Setting up and solving optimization problems in applied
      contexts.
    prerequisites: [maxima-minima, shape-of-graph]
    difficulty: 4
    tags: [ch4, applications]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.78
    mastery_criteria:
      - "Can set up and solve optimization problems in several applied fields"
    misconceptions:
      - "Optimizing before reducing to a single variable via the constraint"
      - "Reporting the critical value of x instead of the quantity the problem asks for"
    decay_halflife_days: 14
    max_attempts: 3
    estimated_minutes: 30

  - id: lhopitals-rule
    name: L'Hopital's Rule (4.8)
    description: >
      Recognizing indeterminate forms and applying L'Hopital's rule;
      relative growth rates of functions.
    prerequisites: [exp-log-derivatives, limit-laws]
    difficulty: 3
    tags: [ch4, technique]
    bloom_level: apply
    assessment_modality: application
    passing_threshold: 0.75
    mastery_criteria:
      - "Can recognize when to apply L'Hopital's rule"
      - "Can identify indeterminate forms produced by quotients, products, subtractions, and powers, and apply L'Hopital's rule in each case"
      - "Can describe the relative growth rates of functions"
